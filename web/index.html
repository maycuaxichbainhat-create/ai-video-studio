<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>AI Video Studio V2 - Co Anh</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:20px} button{background:#38bdf8;color:#000;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px;margin-top:20px}.card{background:#1e293b;padding:10px;border-radius:10px}.card img{width:100%;border-radius:8px} </style></head><body>
<h1>🎬 AI Video Studio V2 - CÓ ẢNH MIỄN PHÍ</h1>
<input type="file" id="file" accept=".txt"> <button onclick="go()">Phân tích & Tạo ảnh</button>
<div id="ketqua"></div><div id="anh" class="grid"></div>
<script>
async function go(){
  const f=document.getElementById('file').files[0]; if(!f)return alert('Chon file!');
  document.getElementById('ketqua').innerText='⏳ Đang tạo 10 ảnh AI (30s)...';
  const fd=new FormData(); fd.append('file',f);
  const res=await fetch('/api/analyze',{method:'POST',body:fd});
  const data=await res.json();
  if(data.status!=='ok'){document.getElementById('ketqua').innerText='Loi: '+data.message;return}
  document.getElementById('ketqua').innerHTML=`✅ <b>${data.title}</b> - ${data.scenes} cảnh`;
  const grid=document.getElementById('anh'); grid.innerHTML='';
  data.images.forEach(it=>{
    grid.innerHTML+=`<div class="card"><img src="${it.image_url}" loading="lazy"><p><b>Cảnh ${it.scene}</b>: ${it.prompt.substring(0,120)}...</p></div>`;
  });
}
</script></body></html>
