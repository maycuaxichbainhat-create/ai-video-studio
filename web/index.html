<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>AI Video Studio V1 - FIX</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:30px}
button{background:#38bdf8;color:#000;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
#ketqua{margin-top:20px;background:#1e293b;padding:15px;border-radius:8px;white-space:pre-wrap}
</style></head>
<body>
<h1>🎬 AI Video Studio V1 - BẢN FIX KHÔNG CẦN KEY</h1>
<p>TXT → nhiều cảnh → nhiều nhân vật → thoại → render MP4 → tải video.</p>
<input type="file" id="file" accept=".txt">
<button onclick="phanTich()">Phân tích kịch bản</button>
<div id="ketqua">Chọn file và bấm nút...</div>
<script>
async function phanTich(){
  const f = document.getElementById('file').files[0];
  if(!f){ alert('Chưa chọn file!'); return; }
  const ketqua = document.getElementById('ketqua');
  ketqua.innerText = '⏳ Đang phân tích (đợi 50s nếu web vừa ngủ)...';
  const form = new FormData(); form.append('file', f);
  try{
    const res = await fetch('/api/analyze', {method:'POST', body: form});
    const data = await res.json();
    if(data.status==='ok'){
      ketqua.innerText = `✅ THÀNH CÔNG!\nTựa: ${data.title}\nSố cảnh: ${data.scenes}\n\nChi tiết:\n` + JSON.stringify(data.project, null, 2);
    }else{
      ketqua.innerText = '❌ LỖI: ' + data.message;
    }
  }catch(e){
    ketqua.innerText = '❌ LỖI KẾT NỐI: ' + e + '\nThử đợi 50s rồi bấm lại (Render free hay ngủ)';
  }
}
</script>
</body></html>
