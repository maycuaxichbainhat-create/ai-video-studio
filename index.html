<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Studio V1</title>
<style>
body{font-family:Arial,sans-serif;background:#10131a;color:#f5f7fb;margin:0}
main{max-width:1100px;margin:auto;padding:32px}
.card{background:#191e28;border:1px solid #303746;border-radius:16px;padding:22px;margin-bottom:18px}
h1{margin-top:0} button{background:#5b8cff;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700}
button:disabled{opacity:.5} input{padding:10px;width:100%;box-sizing:border-box;margin:10px 0 16px}
pre{white-space:pre-wrap;background:#0c0f14;padding:16px;border-radius:10px;max-height:450px;overflow:auto}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#272e3c;margin:3px;font-size:12px}
a{color:#8eb3ff;font-weight:700}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🎬 AI Video Studio V1</h1>
<p>TXT → nhiều cảnh → nhiều nhân vật → thoại → render MP4 → tải video.</p>
<input id="file" type="file" accept=".txt">
<button id="parse">Phân tích kịch bản</button>
</div>
<div class="card" id="result" style="display:none">
<h2>Project</h2>
<div id="summary"></div>
<pre id="json"></pre>
<button id="render">🎥 Dựng video MP4</button>
<div id="download"></div>
</div>
</main>
<script>
let projectId=null;
const $=id=>document.getElementById(id);
$("parse").onclick=async()=>{
 const f=$("file").files[0]; if(!f) return alert("Chọn file TXT trước.");
 const fd=new FormData(); fd.append("file",f);
 $("parse").disabled=true;
 const r=await fetch("/api/parse",{method:"POST",body:fd});
 const d=await r.json(); $("parse").disabled=false;
 if(!r.ok) return alert(d.detail||"Lỗi");
 projectId=d.project_id; $("result").style.display="block";
 const scenes=d.project.scenes;
 const people=[...new Set(scenes.flatMap(s=>s.characters.map(c=>c.name)))];
 $("summary").innerHTML=`<b>${scenes.length}</b> cảnh · <b>${people.length}</b> nhân vật · `+
 people.map(x=>`<span class="badge">${x}</span>`).join("");
 $("json").textContent=JSON.stringify(d.project,null,2);
};
$("render").onclick=async()=>{
 $("render").disabled=true; $("render").textContent="Đang render...";
 const r=await fetch("/api/render/"+projectId,{method:"POST"});
 const d=await r.json(); $("render").disabled=false; $("render").textContent="🎥 Dựng video MP4";
 if(!r.ok) return alert(d.detail||"Render lỗi. Kiểm tra FFmpeg.");
 $("download").innerHTML=`<p>✅ Hoàn tất: <a href="${d.download}" download>⬇ TẢI VIDEO MP4</a></p>`;
};
</script>
</body>
</html>
